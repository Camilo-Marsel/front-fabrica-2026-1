        <div style={{ width:38, height:38, borderRadius:10, background:"#c9a84c", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:22, boxShadow:"0 2px 10px rgba(201,168,76,0.3)" }}>
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" stroke="white" strokeWidth="2.2"/><path d="M2 10h20" stroke="white" strokeWidth="2.2" strokeLinecap="round"/></svg>
        </div>
        {[{label:"Inicio",active:true},{label:"Movs.",active:false},{label:"Trans.",active:false},{label:"Perfil",active:false}].map((item, i) => (
          <div key={i} style={{ width:"100%", padding:"12px 0", display:"flex", flexDirection:"column", alignItems:"center", gap:3, borderLeft: item.active ? "3px solid #c9a84c" : "3px solid transparent", background: item.active ? "rgba(201,168,76,0.1)" : "transparent", cursor:"pointer" }}>
            <div style={{ color: item.active ? "#c9a84c" : "rgba(255,255,255,0.3)", fontSize:9, fontWeight:700, letterSpacing:"0.5px", textTransform:"uppercase" }}>{item.label}</div>
          </div>
        ))}
      </div>
      {/* main */}
      <div style={{ flex:1, overflowY:"auto", padding:"24px 20px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:24 }}>
          <div>
            <div style={{ color:"#9ca3af", fontSize:11, textTransform:"uppercase", letterSpacing:"1.5px", fontWeight:600 }}>Panel principal</div>
            <div style={{ color:"#1a2744", fontSize:20, fontWeight:900, marginTop:3, letterSpacing:"-0.5px" }}>Bryan Morales</div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <div style={{ background:"#c9a84c", color:"white", fontSize:9, fontWeight:800, padding:"4px 10px", borderRadius:5, letterSpacing:"1px", textTransform:"uppercase" }}>Cliente Premium</div>
            <div style={{ width:38, height:38, borderRadius:9, background:"#1a2744", display:"flex", alignItems:"center", justifyContent:"center", color:"#c9a84c", fontWeight:800, fontSize:13 }}>BM</div>
          </div>
        </div>
        {/* balance card */}
        <div style={{ background:"#1a2744", borderRadius:18, padding:"24px", marginBottom:20, position:"relative", overflow:"hidden" }}>
          <div style={{ position:"absolute", top:-10, right:20, color:"rgba(201,168,76,0.08)", fontSize:80, fontWeight:900, lineHeight:1, userSelect:"none" }}>$</div>
          <div style={{ color:"rgba(255,255,255,0.5)", fontSize:10, textTransform:"uppercase", letterSpacing:"2px", fontWeight:600, marginBottom:12 }}>Saldo disponible — COP</div>
          <div style={{ color:"#c9a84c", fontSize:34, fontWeight:900, letterSpacing:"-1.5px", marginBottom:4 }}>$12,450,000</div>
          <div style={{ width:"100%", height:1, background:"rgba(201,168,76,0.18)", margin:"16px 0" }}/>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div>
              <div style={{ color:"rgba(255,255,255,0.35)", fontSize:9, textTransform:"uppercase", letterSpacing:"1.5px" }}>Número de cuenta</div>
              <div style={{ color:"white", fontSize:14, fontWeight:700, marginTop:3 }}>**** **** **** 4892</div>
            </div>
            <div style={{ textAlign:"right" }}>
              <div style={{ color:"rgba(255,255,255,0.35)", fontSize:9, textTransform:"uppercase", letterSpacing:"1.5px" }}>Tipo / Estado</div>
              <div style={{ color:"white", fontSize:14, fontWeight:700, marginTop:3 }}>Ahorros · ACTIVA</div>
            </div>
          </div>
        </div>
        {/* actions */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:20 }}>
          {[{label:"Depositar",icon:"↙",c:"#166534"},{label:"Retirar",icon:"↗",c:"#7c2d12"},{label:"Transferir",icon:"⇄",c:"#1a2744"}].map(a => (
            <div key={a.label} style={{ background:"white", border:"1.5px solid #e2e8f0", borderRadius:12, padding:"16px 8px", textAlign:"center", cursor:"pointer", boxShadow:"0 1px 6px rgba(0,0,0,0.05)" }}>
              <div style={{ width:40, height:40, borderRadius:9, background:a.c, display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 10px", color:"white", fontSize:18, fontWeight:900 }}>{a.icon}</div>
              <div style={{ color:"#374151", fontSize:12, fontWeight:700 }}>{a.label}</div>
            </div>
          ))}
        </div>
        {/* transactions */}
        <div style={{ background:"white", borderRadius:14, border:"1px solid #e2e8f0", overflow:"hidden", boxShadow:"0 1px 8px rgba(0,0,0,0.05)" }}>
          <div style={{ background:"#1a2744", padding:"14px 18px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ color:"white", fontWeight:800, fontSize:13, letterSpacing:"0.3px" }}>Movimientos recientes</div>
            <div style={{ color:"#c9a84c", fontSize:11, fontWeight:700, cursor:"pointer", letterSpacing:"0.5px" }}>VER TODOS →</div>
          </div>
          {TRANSACTIONS.map((t, i) => (
            <div key={t.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"13px 18px", borderBottom: i < TRANSACTIONS.length-1 ? "1px solid #f1f5f9" : "none" }}>
              <div style={{ width:10, height:10, borderRadius:"50%", background: t.pos ? "#16a34a" : "#dc2626", flexShrink:0 }}/>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ color:"#1a2744", fontSize:13, fontWeight:700, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{t.label}</div>
                <div style={{ color:"#9ca3af", fontSize:11 }}>{t.sub} · {t.date}</div>
              </div>
              <div style={{ color: t.pos ? "#16a34a" : "#dc2626", fontSize:13, fontWeight:800, flexShrink:0 }}>{t.amount}</div>
            </div>
          ))}
        </div>
        <button onClick={onBack} style={{ marginTop:14, width:"100%", padding:"10px", borderRadius:9, border:"1px solid #e2e8f0", background:"transparent", color:"#9ca3af", cursor:"pointer", fontSize:11 }}>← Volver al login</button>
      </div>
    </div>
  );
}

/* ──────────────── Proposal Wrapper ──────────────── */
function Proposal({ title, subtitle, palette, isSelected, onSelect, Login, Dashboard }) {
  const [screen, setScreen] = useState("login");
  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%" }}>
      <div style={{ padding:"16px 20px 12px", background:"white", borderBottom:"1px solid #e5e7eb", flexShrink:0 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12 }}>
          <div>
            <div style={{ fontWeight:800, fontSize:16, color:"#111827" }}>{title}</div>
            <div style={{ fontSize:12, color:"#6b7280", marginTop:2 }}>{subtitle}</div>
          </div>
          <div style={{ display:"flex", gap:5 }}>
            {palette.map((c, i) => <div key={i} style={{ width:18, height:18, borderRadius:"50%", background:c, border:"1.5px solid rgba(0,0,0,0.1)" }}/>)}
          </div>
        </div>
        <div style={{ display:"flex", gap:7 }}>
          {["login","dashboard"].map(s => (
            <button key={s} onClick={() => setScreen(s)} style={{ padding:"6px 14px", borderRadius:7, border:"1.5px solid", cursor:"pointer", fontSize:12, fontWeight:700, background: screen===s ? "#111827" : "transparent", color: screen===s ? "white" : "#6b7280", borderColor: screen===s ? "#111827" : "#e5e7eb", transition:"all 0.15s" }}>
              {s === "login" ? "🔑 Login" : "📊 Dashboard"}
            </button>
          ))}
        </div>
      </div>
      <div style={{ flex:1, overflow:"hidden", position:"relative" }}>
        <div style={{ position:"absolute", inset:0, overflowY:"auto" }}>
          {screen === "login" ? <Login onNext={() => setScreen("dashboard")}/> : <Dashboard onBack={() => setScreen("login")}/>}
        </div>
      </div>
      <div style={{ padding:"12px 16px", background:"white", borderTop:"1px solid #e5e7eb", flexShrink:0 }}>
        <button onClick={onSelect} style={{ width:"100%", padding:"12px", borderRadius:9, border:"none", cursor:"pointer", background: isSelected ? "#059669" : "#111827", color:"white", fontWeight:800, fontSize:14, transition:"background 0.2s", display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
          {isSelected ? "✓ ¡Estilo seleccionado!" : "Seleccionar este estilo"}
        </button>
      </div>
    </div>
  );
}

/* ──────────────── Main App ──────────────── */
const PROPOSALS = [
  { id:"dark", label:"Dark Neon Pro", title:"1. Dark Neon Pro", subtitle:"Oscuro · Gradientes · Glassmorphism", palette:["#0d1333","#6366f1","#8b5cf6","#10b981"], Login:DarkLogin, Dashboard:DarkDashboard },
  { id:"mint", label:"Fresh Mint", title:"2. Fresh Mint", subtitle:"Claro · Verde esmeralda · Amigable y fresco", palette:["#f0fdf4","#059669","#d97706","#10b981"], Login:MintLogin, Dashboard:MintDashboard },
  { id:"gold", label:"Classic Gold", title:"3. Classic Gold", subtitle:"Marino · Dorado · Profesional y confiable", palette:["#1a2744","#c9a84c","#ffffff","#f8fafc"], Login:GoldLogin, Dashboard:GoldDashboard },
];

function App() {
  const [active, setActive] = useState("dark");
  const [selected, setSelected] = useState(null);

  return (
    <div style={{ minHeight:"100vh", background:"#e2e8f0", display:"flex", flexDirection:"column" }}>
      {/* header */}
      <div style={{ background:"#0f172a", padding:"14px 24px", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
        <div>
          <div style={{ color:"white", fontWeight:800, fontSize:17, letterSpacing:"-0.3px" }}>🏦 Fábrica Escuela — Propuestas de Diseño</div>
          <div style={{ color:"#64748b", fontSize:12, marginTop:2 }}>Elige el estilo visual para el frontend del banco digital</div>
        </div>
        {selected && (
          <div style={{ background:"#059669", color:"white", padding:"8px 18px", borderRadius:9, fontSize:13, fontWeight:800, display:"flex", alignItems:"center", gap:6 }}>
            ✓ {PROPOSALS.find(p=>p.id===selected)?.label}
          </div>
        )}
      </div>
      {/* tabs */}
      <div style={{ background:"white", borderBottom:"1px solid #e5e7eb", padding:"0 24px", display:"flex", alignItems:"center", flexShrink:0 }}>
        {PROPOSALS.map(p => (
          <button key={p.id} onClick={() => setActive(p.id)} style={{ padding:"13px 22px", border:"none", cursor:"pointer", background:"transparent", fontWeight: active===p.id ? 800 : 500, fontSize:14, color: active===p.id ? "#111827" : "#9ca3af", borderBottom: active===p.id ? "3px solid #111827" : "3px solid transparent", transition:"all 0.15s", display:"flex", alignItems:"center", gap:6 }}>
            {p.title}{selected===p.id ? <span style={{ color:"#059669", fontSize:12 }}>✓</span> : ""}
          </button>
        ))}
        <div style={{ flex:1 }}/>
        <div style={{ fontSize:11, color:"#9ca3af", paddingRight:4 }}>Clic en 🔑 / 📊 para cambiar pantalla</div>
      </div>
      {/* proposal area */}
      <div style={{ flex:1, padding:"20px 24px", minHeight:0 }}>
        <div style={{ height:"calc(100vh - 130px)" }}>
          {PROPOSALS.map(p => (
            <div key={p.id} style={{ display: active===p.id ? "block" : "none", height:"100%", background:"white", borderRadius:18, overflow:"hidden", boxShadow:"0 4px 28px rgba(0,0,0,0.12)", border: selected===p.id ? "3px solid #059669" : "3px solid transparent", transition:"border 0.2s" }}>
              <Proposal title={p.title} subtitle={p.subtitle} palette={p.palette} isSelected={selected===p.id} onSelect={() => setSelected(p.id)} Login={p.Login} Dashboard={p.Dashboard}/>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
